<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#040506" />
  <title>Bottleography — Usually, the dead ones</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="world" aria-label="A painted 3D room"></canvas>
  <div id="tooltip" hidden></div>
  <header id="place" class="place"></header>
  <nav class="tools" aria-label="Tools">
    <button id="journal-toggle" aria-haspopup="dialog">Diary <kbd>J</kbd></button>
    <button id="history-toggle" aria-haspopup="dialog">History <kbd>H</kbd></button>
    <button id="fullscreen-toggle" aria-label="Toggle fullscreen">Fullscreen</button>
  </nav>
  <div id="title-card" class="title-card" aria-live="polite"></div>
  <section class="stage" aria-label="Dialogue">
    <article id="end" hidden></article>
    <p id="subtitle" class="subtitle" aria-live="polite"></p>
    <ol id="choices" class="choices" aria-label="Your response"></ol>
    <p id="notice" role="status"></p>
  </section>
  <dialog id="journal-dialog" aria-label="Pages">
    <button id="journal-close" class="journal-close" aria-label="Close">Close <kbd>Esc</kbd></button>
    <article id="journal" class="journal"></article>
  </dialog>
  <dialog id="history-dialog" aria-label="Everything said tonight">
    <button id="history-close" class="journal-close" aria-label="Close history">Close <kbd>Esc</kbd></button>
    <div id="history" class="history"></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
